[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-rag-assistant"
version = "0.1.0"
description = "Symbol-level RAG over a codebase: ask in natural language, get ranked functions/classes with exact file:line locations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
    "sentence-transformers",
    "chromadb",
    "typer",
    "rich",
    "mcp[cli]",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codebase-rag = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["extract", "store", "main", "mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
